# Created by Rui MA on 08 Oct 2026

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Release ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    defaults:
      run:
        working-directory: windows
    env:
      UNLOCK_TARGET_ARCH: ${{ matrix.architecture }}
      UNLOCK_VS_DEV_CMD: auto
      UNLOCK_CMAKE_COMMAND: cmake
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Expected a version tag such as v0.1.0.'
          }

      - name: Build Release installer
        shell: cmd
        run: |
          if not exist "..\.tmp" mkdir "..\.tmp"
          if errorlevel 1 exit /b %errorlevel%
          set "TEMP=%CD%\..\.tmp"
          set "TMP=%TEMP%"
          call Invoke-NativeVsDevCmd.cmd --fresh -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          if errorlevel 1 exit /b %errorlevel%
          call Invoke-NativeVsDevCmd.cmd --build build --config Release --target unlock_windows_components_wizard
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify installer version and architecture
        shell: pwsh
        run: |
          . .\WindowsArchitecture.ps1
          $installers = @(Get-ChildItem -LiteralPath dist -Filter '*.exe' -File -ErrorAction Stop)
          if ($installers.Count -ne 1) {
              throw "Expected one installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer.FullName)
          if ("v$($version.ProductVersion)" -cne $env:GITHUB_REF_NAME -or $version.FileVersion -cne $version.ProductVersion) {
              throw "Installer version does not match tag $env:GITHUB_REF_NAME."
          }
          if ((Get-PortableExecutableArchitecture -Path $installer.FullName) -cne $env:UNLOCK_TARGET_ARCH) {
              throw "Installer architecture does not match $env:UNLOCK_TARGET_ARCH."
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.ref_name }}-${{ matrix.architecture }}
          path: windows/dist/*.exe
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: xcode-27
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Archive without signing
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild archive \
            -project ios/ios.xcodeproj \
            -scheme ios \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UnlockPC.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          shopt -s nullglob
          apps=("$RUNNER_TEMP/UnlockPC.xcarchive/Products/Applications/"*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "Expected one archived iOS app, found ${#apps[@]}." >&2
            exit 1
          fi
          app="${apps[0]}"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          platform=$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$app/Info.plist")
          if [[ "$platform" != iphoneos ]]; then
            echo "Expected an iOS device build, found $platform." >&2
            exit 1
          fi
          lipo -verify_arch arm64 "$app/$executable"
          if [[ -d "$app/_CodeSignature" || -f "$app/embedded.mobileprovision" ]]; then
            echo 'Expected an unsigned app without a provisioning profile.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/$(basename "$app")"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/UnlockPC_${GITHUB_REF_NAME}_unsigned.ipa" Payload)
          unzip -t "dist/UnlockPC_${GITHUB_REF_NAME}_unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ github.ref_name }}-unsigned
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, ios]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: windows-${{ github.ref_name }}-*
          path: installers
          merge-multiple: true

      - name: Download unsigned IPA
        uses: actions/download-artifact@v8
        with:
          name: ios-${{ github.ref_name }}-unsigned
          path: installers

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath installers -Filter '*.exe' -File -ErrorAction Stop)
          if ($installers.Count -ne 2) {
              throw "Expected two installers, found $($installers.Count)."
          }
          $ipas = @(Get-ChildItem -LiteralPath installers -Filter '*.ipa' -File -ErrorAction Stop)
          if ($ipas.Count -ne 1) {
              throw "Expected one unsigned IPA, found $($ipas.Count)."
          }
          $assets = @($installers.FullName) + @($ipas.FullName)
          @"
          Windows Release installers for x64 and ARM64, plus an unsigned iOS IPA, built from the same tagged revision.

          Commit: $env:GITHUB_SHA
          Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          The iOS IPA is unsigned and cannot be installed directly. Sign it with your own Apple development credentials and provisioning before installing on a physical iPhone running iOS 26 or later. No signing certificate or provisioning profile is included.

          CI checks Windows package versions and PE architectures, and the iOS device platform, arm64 binary and IPA archive. Tests, signing, installation, BLE and native unlock are not exercised by this workflow; ARM64 physical-device acceptance remains unverified. This is a developer technical preview.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title $env:GITHUB_REF_NAME --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

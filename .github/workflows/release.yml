# Created by Rui MA on 08 Oct 2026

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: windows-2022
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate version tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(?<prerelease>-rc[0-9]*)?$') {
              throw 'Expected a version tag such as v1.0.0, v1.0.0-rc or v1.0.0-rc1.'
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$([bool]$Matches.prerelease)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

  build:
    name: Release ${{ matrix.architecture }}
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    defaults:
      run:
        working-directory: windows
    env:
      UNLOCK_TARGET_ARCH: ${{ matrix.architecture }}
      UNLOCK_VS_DEV_CMD: auto
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate product release version
        shell: pwsh
        run: |
          . .\WindowsBuild.ps1
          $metadata = Get-ProductBuildMetadata -Architecture $env:UNLOCK_TARGET_ARCH
          if ($metadata.ReleaseVersion -cne $env:RELEASE_VERSION) {
              throw "Product release version does not match tag $env:GITHUB_REF_NAME."
          }

      - name: Run all Release tests
        shell: cmd
        run: |
          if not exist "..\.tmp" mkdir "..\.tmp"
          if errorlevel 1 exit /b %errorlevel%
          set "TEMP=%CD%\..\.tmp"
          set "TMP=%TEMP%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File WindowsBuild.ps1 -Prepare -OutputDirectory build
          if errorlevel 1 exit /b %errorlevel%
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File WindowsBuild.ps1 -InvokeMSBuild "UnlockWindowsTests.proj" /t:Test /m:1 /nologo "/p:Configuration=Release" "/p:UnlockBuildDirectory=%CD%\build" "/p:BuildTesting=ON"
          if errorlevel 1 exit /b %errorlevel%

      - name: Build Release installer
        shell: cmd
        run: |
          set "TEMP=%CD%\..\.tmp"
          set "TMP=%TEMP%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File WindowsBuild.ps1 -InvokeMSBuild "UnlockWindows.sln" /restore /m /nologo "/p:Configuration=Release" "/p:UnlockBuildDirectory=%CD%\build" "/p:BuildTesting=OFF"
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify installer version and architecture
        shell: pwsh
        run: |
          . .\WindowsBuild.ps1
          $installers = @(Get-ChildItem -LiteralPath dist -Filter '*.exe' -File -ErrorAction Stop)
          if ($installers.Count -ne 1) {
              throw "Expected one installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $metadata = Get-ProductBuildMetadata -Architecture $env:UNLOCK_TARGET_ARCH
          $expected = [version]$metadata.Version
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer.FullName)
          if ($version.ProductVersion -cne $metadata.Version -or $version.FileVersion -cne $metadata.Version -or
              [version]::new($version.ProductMajorPart, $version.ProductMinorPart, $version.ProductBuildPart, $version.ProductPrivatePart) -ne $expected -or
              [version]::new($version.FileMajorPart, $version.FileMinorPart, $version.FileBuildPart, $version.FilePrivatePart) -ne $expected -or
              $installer.Name -cne $metadata.SetupFile) {
              throw 'Installer name or four-part version does not match ProductVersion.h.'
          }
          if ((Get-PortableExecutableArchitecture -Path $installer.FullName) -cne $env:UNLOCK_TARGET_ARCH) {
              throw "Installer architecture does not match $env:UNLOCK_TARGET_ARCH."
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.ref_name }}-${{ matrix.architecture }}
          path: windows/dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: windows-${{ github.ref_name }}-*
          path: installers
          merge-multiple: true

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath installers -Filter '*.exe' -File -ErrorAction Stop)
          if ($installers.Count -ne 2) {
              throw "Expected two installers, found $($installers.Count)."
          }
          $assets = @($installers.FullName)
          @"
          Windows Release installers for x64 and ARM64, built from the same tagged revision. No iPhone app is required.

          Commit: $env:GITHUB_SHA
          Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID


          CI requires all four native Release test programs to pass on both x64 and ARM64 and checks Windows package versions and PE architectures. Installation, BLE and native unlock are not exercised by this workflow. The presence-unlock hardware acceptance matrix remains pending.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          $releaseOptions = @()
          if ($env:RELEASE_PRERELEASE -ceq 'true') {
              $releaseOptions = @('--prerelease', '--latest=false')
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title $env:GITHUB_REF_NAME --notes-file release-notes.md @releaseOptions
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

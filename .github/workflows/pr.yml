name: PR build

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    defaults:
      run:
        working-directory: windows
    env:
      Platform: ${{ matrix.architecture }}
    steps:
      - name: Check out PR merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: ${{ matrix.architecture }}

      - name: Build Release solution
        shell: cmd
        run: |
          msbuild UnlockWindows.sln /restore /m /nologo /p:Platform=%Platform% /p:Configuration=Release "/p:UnlockBuildDirectory=%CD%\build" /p:BuildTesting=OFF
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify MSI database and embedded payload
        shell: cmd
        run: |
          msbuild UnlockWindows.sln /t:ValidateMsi /nologo /p:Platform=%Platform% /p:Configuration=Release "/p:UnlockBuildDirectory=%CD%\build"
          if errorlevel 1 exit /b %errorlevel%
      - name: Determine snapshot artifact name
        id: snapshot
        shell: cmd
        run: |
          msbuild UnlockWindows.sln /t:ExportBuildMetadata /nologo /p:Platform=%Platform% "/p:MetadataOutputFile=%GITHUB_OUTPUT%"
          if errorlevel 1 exit /b %errorlevel%

      - name: Upload snapshot installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.snapshot.outputs.name }}
          path: ${{ steps.snapshot.outputs.path }}
          if-no-files-found: error

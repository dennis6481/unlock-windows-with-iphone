name: PR build

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    defaults:
      run:
        working-directory: windows
    env:
      UNLOCK_TARGET_ARCH: ${{ matrix.architecture }}
      UNLOCK_VS_DEV_CMD: auto
    steps:
      - name: Check out PR merge revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Release solution
        shell: cmd
        run: |
          if not exist "..\.tmp" mkdir "..\.tmp"
          if errorlevel 1 exit /b %errorlevel%
          set "TEMP=%CD%\..\.tmp"
          set "TMP=%TEMP%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File WindowsBuild.ps1 -Prepare -OutputDirectory build
          if errorlevel 1 exit /b %errorlevel%
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File WindowsBuild.ps1 -InvokeMSBuild "UnlockWindows.sln" /restore /m /nologo "/p:Configuration=Release" "/p:UnlockBuildDirectory=%CD%\build" "/p:BuildTesting=OFF"
          if errorlevel 1 exit /b %errorlevel%

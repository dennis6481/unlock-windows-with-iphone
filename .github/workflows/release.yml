# Created by Rui MA on 08 Oct 2026

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: windows-2022
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate version tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(?<prerelease>-rc[0-9]*)?$') {
              throw 'Expected a version tag such as v1.0.0, v1.0.0-rc or v1.0.0-rc1.'
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$([bool]$Matches.prerelease)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

  build:
    name: Release ${{ matrix.architecture }}
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    defaults:
      run:
        working-directory: windows
    env:
      Platform: ${{ matrix.architecture }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: ${{ matrix.architecture }}

      - name: Validate product release version
        shell: cmd
        run: |
          msbuild UnlockWindows.sln /t:ValidateBuildContracts /nologo /p:Platform=%Platform% "/p:ExpectedReleaseVersion=%RELEASE_VERSION%"
          if errorlevel 1 exit /b %errorlevel%

      - name: Run all Release tests
        shell: cmd
        run: |
          msbuild UnlockWindowsTests.proj /t:Test /m:1 /nologo /p:Platform=%Platform% /p:Configuration=Release "/p:UnlockBuildDirectory=%CD%\build" /p:BuildTesting=ON
          if errorlevel 1 exit /b %errorlevel%

      - name: Build Release installer
        shell: cmd
        run: |
          msbuild UnlockWindows.sln /restore /m /nologo /p:Platform=%Platform% /p:Configuration=Release "/p:UnlockBuildDirectory=%CD%\build" /p:BuildTesting=OFF
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify MSI database and embedded payload
        shell: cmd
        run: |
          msbuild UnlockWindows.sln /t:ValidateMsi /nologo /p:Platform=%Platform% /p:Configuration=Release "/p:UnlockBuildDirectory=%CD%\build"
          if errorlevel 1 exit /b %errorlevel%
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.ref_name }}-${{ matrix.architecture }}
          path: dist/*.msi
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: windows-${{ github.ref_name }}-*
          path: installers
          merge-multiple: true

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath installers -Filter '*.msi' -File -ErrorAction Stop)
          if ($installers.Count -ne 2) {
              throw "Expected two installers, found $($installers.Count)."
          }
          $assets = @($installers.FullName)
          @"
          Windows Release installers for x64 and ARM64, built from the same tagged revision. No iPhone app is required.

          Commit: $env:GITHUB_SHA
          Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID


          CI requires all three native Release test programs to pass on both x64 and ARM64 and checks MSI database properties, embedded cabinets and extracted PE versions/architectures. Installation, BLE and native unlock are not exercised by this workflow.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          $releaseOptions = @()
          if ($env:RELEASE_PRERELEASE -ceq 'true') {
              $releaseOptions = @('--prerelease', '--latest=false')
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title $env:GITHUB_REF_NAME --notes-file release-notes.md @releaseOptions
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
